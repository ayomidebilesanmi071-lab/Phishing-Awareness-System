{% extends "base.html" %}
{% block page_title %}Server Error{% endblock %}
{% block content %}
<div class="card error-card">
  <div class="error-code">500</div>
  <h2>Something Went Wrong</h2>
  <p>An unexpected error occurred. The incident has been recorded; please try again
     in a moment or contact the security team.</p>
  <a href="{{ url_for('auth.login') if not current_user.is_authenticated else url_for('awareness.articles') }}"
     class="btn btn-primary">Go to the home page</a>
</div>
{% endblock %}
