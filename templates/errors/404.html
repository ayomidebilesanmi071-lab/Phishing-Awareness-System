{% extends "base.html" %}
{% block page_title %}Not Found{% endblock %}
{% block content %}
<div class="card error-card">
  <div class="error-code">404</div>
  <h2>Page Not Found</h2>
  <p>The page you requested does not exist, or you do not have access to it.</p>
  <a href="{{ url_for('auth.login') if not current_user.is_authenticated else url_for('awareness.articles') }}"
     class="btn btn-primary">Go to the home page</a>
</div>
{% endblock %}
